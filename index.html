<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cayu·Pol</title>
  <meta name="theme-color" content="#0f1f35">
  <link rel="manifest" href="./manifest.webmanifest?v=20260327l">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./assets/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./assets/icons/icon-152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png">
  <link rel="stylesheet" href="./styles.css?v=20260327l">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>Cayu·Pol 🛶</h1>
      <div class="top-actions">
        <button id="btnExport" class="btn icon-btn" type="button" aria-label="Guardar" title="Guardar">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2" />
              <path d="M10 14a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
              <path d="M14 4l0 4l-6 0l0 -4" />
            </svg>
          </span>
        </button>
        <label class="btn icon-btn" for="fileImport" aria-label="Cargar" title="Cargar">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 19l2.757 -7.351a1 1 0 0 1 .936 -.649h12.307a1 1 0 0 1 .986 1.164l-.996 5.211a2 2 0 0 1 -1.964 1.625h-14.026a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v2" />
            </svg>
          </span>
        </label>
        <input id="fileImport" type="file" accept="application/json" hidden>
        <button id="btnClear" class="btn icon-btn icon-btn-danger" type="button" aria-label="Limpiar" title="Limpiar">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6l-12 12" />
              <path d="M6 6l12 12" />
            </svg>
          </span>
        </button>
      </div>
    </header>

    <nav id="tabSwitch" class="tab-switch" data-active="general" aria-label="Pantallas">
      <span class="tab-switch-indicator" aria-hidden="true"></span>
      <button class="tab is-active" data-tab="general" type="button">Datos generales</button>
      <button class="tab" data-tab="people" type="button">Personas</button>
    </nav>

    <main>
      <section id="screen-general" class="screen is-active" aria-label="Datos generales">
        <div class="card">
          <form id="generalForm" autocomplete="off">
            <div id="generalFields" class="form-grid form-grid-general"></div>
          </form>
        </div>
      </section>

      <section id="screen-people" class="screen" aria-label="Personas">
        <div class="card">
          <h2>NUEVA PERSONA</h2>
          <form id="personForm" autocomplete="off">
            <div class="form-grid">
              <label>
                Nº pulsera
                <input type="text" name="numPulsera">
              </label>
              <label>
                Sexo
                <select name="sexo">
                  <option value="">-</option>
                  <option value="MASCULINO">Masculino</option>
                  <option value="FEMENINO">Femenino</option>
                </select>
              </label>
              <label>
                Nombre
                <input type="text" name="nombre" required>
              </label>
              <label>
                Apellidos
                <input type="text" name="apellidos">
              </label>
              <label>
                Fecha nacimiento
                <input type="date" name="fechaNacimiento">
              </label>
              <label>
                Lugar nacimiento
                <input type="text" name="lugarNacimiento" list="africanCountriesList">
              </label>
              <label>
                País
                <input type="text" name="pais" list="africanCountriesList">
              </label>
              <label>
                Nacionalidad
                <input type="text" name="nacionalidad" list="africanCountriesList">
              </label>
              <label>
                Padres
                <input type="text" name="padres">
              </label>
              <label>
                Pasaporte/Carta
                <input type="text" name="pasaporteCarta">
              </label>
              <label>
                Pulsera Cruz Roja
                <input type="text" name="pulseraCruzRoja">
              </label>
              <label>
                Idioma
                <input type="text" name="idioma" list="idiomaList">
              </label>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn icon-btn" id="submitPerson" aria-label="Añadir persona" title="Añadir persona">
                <span class="btn-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9.5" cy="7.5" r="3.5" />
                    <path d="M3 20v-1a4.5 4.5 0 0 1 4.5 -4.5h4" />
                    <path d="M16 8v8" />
                    <path d="M12 12h8" />
                  </svg>
                </span>
              </button>
              <button type="button" class="btn" id="cancelEdit" hidden>Cancelar edición</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="list-head">
            <h2>Listado</h2>
            <strong id="peopleCount">0</strong>
          </div>
          <div id="peopleList" class="people-list"></div>
        </div>
      </section>
    </main>
  </div>

  <datalist id="africanCountriesList"></datalist>
  <datalist id="idiomaList"></datalist>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js?v=20260327l"></script>
</body>
</html>
