<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cayu·Pol</title>
  <meta name="theme-color" content="#0f1f35">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./assets/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./assets/icons/icon-152.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>Cayu·Pol</h1>
      <div class="top-actions">
        <button id="btnExport" class="btn btn-primary" type="button">Guardar</button>
        <label class="btn" for="fileImport">Cargar</label>
        <input id="fileImport" type="file" accept="application/json" hidden>
        <button id="btnClear" class="btn btn-danger" type="button" aria-label="Limpiar">ⓧ</button>
      </div>
    </header>

    <nav id="tabSwitch" class="tab-switch" data-active="general" aria-label="Pantallas">
      <span class="tab-switch-indicator" aria-hidden="true"></span>
      <button class="tab is-active" data-tab="general" type="button">Datos generales</button>
      <button class="tab" data-tab="people" type="button">Integrantes</button>
    </nav>

    <main>
      <section id="screen-general" class="screen is-active" aria-label="Datos generales">
        <div class="card">
          <h2>Datos generales de sesión</h2>
          <form id="generalForm" autocomplete="off">
            <div id="generalFields" class="form-grid form-grid-general"></div>
          </form>
        </div>
      </section>

      <section id="screen-people" class="screen" aria-label="Integrantes">
        <div class="card">
          <h2>Nuevo integrante</h2>
          <form id="personForm" autocomplete="off">
            <div class="form-grid">
              <label>
                Nº pulsera
                <input type="text" name="numPulsera">
              </label>
              <label>
                Nombre
                <input type="text" name="nombre" required>
              </label>
              <label>
                Apellidos
                <input type="text" name="apellidos">
              </label>
              <label>
                Sexo
                <select name="sexo">
                  <option value="">-</option>
                  <option value="MASCULINO">Masculino</option>
                  <option value="FEMENINO">Femenino</option>
                </select>
              </label>
              <label>
                Fecha nacimiento
                <input type="date" name="fechaNacimiento">
              </label>
              <label>
                Lugar nacimiento
                <input type="text" name="lugarNacimiento" list="africanCountriesList">
              </label>
              <label>
                País
                <input type="text" name="pais" list="africanCountriesList">
              </label>
              <label>
                Nacionalidad
                <input type="text" name="nacionalidad" list="africanCountriesList">
              </label>
              <label>
                Padres
                <input type="text" name="padres">
              </label>
              <label>
                Pasaporte/Carta
                <input type="text" name="pasaporteCarta">
              </label>
              <label>
                Pulsera Cruz Roja
                <input type="text" name="pulseraCruzRoja">
              </label>
              <label>
                Idioma
                <input type="text" name="idioma">
              </label>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submitPerson">Añadir integrante</button>
              <button type="button" class="btn" id="cancelEdit" hidden>Cancelar edición</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="list-head">
            <h2>Listado</h2>
            <strong id="peopleCount">0</strong>
          </div>
          <div id="peopleList" class="people-list"></div>
        </div>
      </section>
    </main>
  </div>

  <datalist id="africanCountriesList"></datalist>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
